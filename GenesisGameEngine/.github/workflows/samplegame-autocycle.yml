name: SampleGame Auto-Cycle Test

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        run: .\\vcpkg\\bootstrap-vcpkg.bat

      - name: Install dependencies (vcpkg)
        run: .\\vcpkg\\vcpkg.exe install sdl2:x64-windows assimp:x64-windows --disable-metrics

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=.\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build SampleGame
        run: cmake --build build --config Release --target SampleGame --verbosity minimal

      - name: Run SampleGame auto-cycle
        run: .\\build\\Release\\SampleGame.exe --gfx-order software --auto-cycle 5 --auto-interval 1000
        timeout-minutes: 10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: samplegame-artifacts
          path: artifacts
