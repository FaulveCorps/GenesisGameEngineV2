name: Vulkan Nightly Stress Test

# Run nightly to increase chance of catching intermittent crashes on Windows Vulkan path
on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  vulkan-nightly:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      ITERATIONS: 500
      STRESS_PER_ITER: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/archives
          vcpkg/vcpkg.exe
        key: ${{ runner.os }}-vcpkg-nightly-${{ hashFiles('vcpkg/**') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Bootstrap vcpkg (skip if present)
      shell: powershell
      run: |
        if (-Not (Test-Path .\vcpkg\vcpkg.exe)) { .\vcpkg\bootstrap-vcpkg.bat } else { Write-Host "vcpkg.exe present" }

    - name: Install vcpkg dependencies
      shell: powershell
      run: |
        .\vcpkg\vcpkg.exe install sdl2:x64-windows assimp:x64-windows vulkan-loader:x64-windows --disable-metrics

    - name: Configure & build SampleGame
      shell: powershell
      run: |
        cmake -S . -B build -G "Ninja" -A x64 -DCMAKE_BUILD_TYPE=Debug -DVCPKG_INSTALLED="${{ github.workspace }}\vcpkg\installed\x64-windows"
        cmake --build build --config Debug --target SampleGame

    - name: Setup ProcDump (optional)
      shell: powershell
      continue-on-error: true
      run: |
        if (Test-Path .\scripts\run_procdump_setup.ps1) { powershell -ExecutionPolicy Bypass -File .\scripts\run_procdump_setup.ps1 } else { Write-Host "ProcDump setup not present" }

    - name: Run nightly Vulkan stress iterations
      shell: powershell
      continue-on-error: true
      run: |
        $exe = Join-Path $PWD "build\\GameProjects\\SampleGame\\Debug\\SampleGame.exe"
        if (-Not (Test-Path $exe)) { Write-Error "SampleGame executable not found: $exe"; exit 2 }
        $iterations = [int]$Env:ITERATIONS
        $per = [int]$Env:STRESS_PER_ITER
        Write-Host "Starting nightly Vulkan stress loop: iterations=$iterations per_iteration_stress=$per"
        $crashed = $false
        for ($i=1; $i -le $iterations; ++$i) {
            Write-Host "Iteration $i/$iterations"
            $log = "smoke-vulkan-night-iter-$i.log"
            $procdump = Join-Path $PWD "tools\\Procdump\\procdump.exe"
            if (Test-Path $procdump -PathType Leaf) {
                & $procdump -accepteula -e 1 -ma -o -n 1 $exe --gfx-order vulkan --vulkan-triangle --force-vulkan-swapchain --stress $per *>&1 | Tee-Object -FilePath $log
            } else {
                & $exe --gfx-order vulkan --vulkan-triangle --force-vulkan-swapchain --stress $per *>&1 | Tee-Object -FilePath $log
            }
            $exit = $LASTEXITCODE
            if ($exit -ne 0) {
                Write-Host "Iteration $i: non-zero exit ($exit)"
                $crashed = $true
                break
            }
            # check for dmp files produced
            $dumps = Get-ChildItem -Path . -Filter "*.dmp" -Recurse -ErrorAction SilentlyContinue
            if ($dumps) {
                Write-Host "Iteration $i: found dmp files"
                $crashed = $true
                break
            }
        }
        if ($crashed) { Write-Host "Vulkan nightly detected a crash"; exit 1 } else { Write-Host "Vulkan nightly completed without crash" }

    - name: Upload nightly iteration logs
      uses: actions/upload-artifact@v4
      with:
        name: vulkan-night-iteration-logs
        path: smoke-vulkan-night-iter-*.log
        retention-days: 30

    - name: Upload any ProcDump .dmp files (if present)
      if: failure() || always()
      uses: actions/upload-artifact@v4
      with:
        name: vulkan-night-dmp-files
        path: |
          **/*.dmp
          tools/Procdump/*.dmp
        retention-days: 90

    - name: Upload build folder (diagnostic)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: vulkan-night-build
        path: build
        retention-days: 7
