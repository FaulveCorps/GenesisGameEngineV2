name: Windows Graphics Matrix Smoke Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - gfx: d3d12
            extraArgs: ""
            stress: 10
          - gfx: d3d11
            extraArgs: ""
            stress: 10
          - gfx: opengl
            extraArgs: ""
            stress: 10
          - gfx: wgpu
            extraArgs: ""
            stress: 10
          - gfx: vulkan
            extraArgs: "--vulkan-triangle --force-vulkan-swapchain"
            stress: 200
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache vcpkg (installed + binaries)
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/archives
          vcpkg/vcpkg.exe
        key: ${{ runner.os }}-vcpkg-${{ matrix.gfx }}-${{ hashFiles('vcpkg/**') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Bootstrap vcpkg
      shell: powershell
      run: |
        Write-Host "Bootstrapping vcpkg..."
        if (-Not (Test-Path .\vcpkg\vcpkg.exe)) { .\vcpkg\bootstrap-vcpkg.bat } else { Write-Host "vcpkg.exe already present - skipping bootstrap" }

    - name: Install vcpkg dependencies
      shell: powershell
      run: |
        Write-Host "Installing vcpkg packages (sdl2, assimp, vulkan-loader)..."
        $gfx = '${{ matrix.gfx }}'
        $packages = "sdl2:x64-windows assimp:x64-windows vulkan-loader:x64-windows"
        if ($gfx -eq 'wgpu') { Write-Host "Matrix gfx is wgpu; adding dawn:x64-windows to installation list"; $packages += " dawn:x64-windows" }
        Write-Host "Installing packages: $packages"
        .\vcpkg\vcpkg.exe install $packages --disable-metrics

    - name: Try installing Dawn/wgpu via vcpkg (best-effort)
      if: matrix.gfx == 'wgpu'
      shell: powershell
      continue-on-error: true
      run: |
        Write-Host "Attempting to install Dawn (wgpu) via vcpkg..."
        .\vcpkg\vcpkg.exe install dawn:x64-windows --disable-metrics || Write-Host "dawn port not available or failed; attempting wgpu-native"
        .\vcpkg\vcpkg.exe install wgpu-native:x64-windows --disable-metrics || Write-Host "wgpu-native port not available or failed; continuing"
        # List likely include/library locations
        $candidates = @(
          "./vcpkg/installed/x64-windows/include/dawn/dawn_proc.h",
          "./vcpkg/installed/x64-windows/include/wgpu.h",
          "./vcpkg/installed/x64-windows/lib/dawn.lib",
          "./vcpkg/installed/x64-windows/lib/wgpu.lib"
        )
        foreach ($c in $candidates) { if (Test-Path $c) { Write-Host "Found candidate wgpu/dawn file: $c" } }
        Write-Host "Dawn/wgpu installation attempt complete (may have failed). The build will detect presence via CMake."

    - name: Verify Dawn/wgpu installed (required for gfx=wgpu)
      if: matrix.gfx == 'wgpu'
      shell: powershell
      run: |
        Write-Host "Verifying Dawn/wgpu installation..."
        $headerPaths = @(
          "./vcpkg/installed/x64-windows/include/dawn/dawn_proc.h",
          "./vcpkg/installed/x64-windows/include/webgpu/webgpu.h",
          "./vcpkg/installed/x64-windows/include/wgpu.h"
        )
        $libPaths = @(
          "./vcpkg/installed/x64-windows/lib/webgpu_dawn.lib",
          "./vcpkg/installed/x64-windows/lib/dawn.lib",
          "./vcpkg/installed/x64-windows/lib/wgpu.lib"
        )
        $foundHeader = $false
        foreach ($p in $headerPaths) { if (Test-Path $p) { Write-Host "Found header: $p"; $foundHeader = $true; break } }
        if (-not $foundHeader) { Write-Error "Dawn/wgpu headers not found in vcpkg installed tree - ensure dawn:x64-windows is available or pre-cached"; exit 1 }
        $foundLib = $false
        foreach ($p in $libPaths) { if (Test-Path $p) { Write-Host "Found lib: $p"; $foundLib = $true; break } }
        if (-not $foundLib) { Write-Error "Dawn/wgpu libs not found in vcpkg installed tree - ensure dawn:x64-windows is available or pre-cached"; exit 1 }

    - name: Download prebuilt shaderc (fallback)
      if: matrix.gfx == 'bgfx'
      shell: powershell
      continue-on-error: true
      run: |
        Write-Host "Attempting to discover shaderc release from GitHub (google/shaderc)..."
        $api = 'https://api.github.com/repos/google/shaderc/releases/latest'
        try {
          $rel = Invoke-RestMethod -UseBasicParsing -Uri $api -ErrorAction Stop
          $asset = $rel.assets | Where-Object { $_.name -match 'win' -and ($_.name -match '\.zip$' -or $_.name -match '\.7z$' -or $_.name -match '\.tar.gz$') } | Select-Object -First 1
          if ($asset) {
            $url = $asset.browser_download_url
            Write-Host "Found release asset: $($asset.name)"
            $out = "tools\shaderc_release.zip"
            Invoke-WebRequest -UseBasicParsing -OutFile $out -Uri $url
            Write-Host "Downloaded $out; extracting..."
            Expand-Archive -Path $out -DestinationPath tools\shaderc -Force
            Write-Host "Extraction complete. Looking for shaderc.exe..."
            $shadercCandidates = Get-ChildItem -Path tools\shaderc -Recurse -Filter 'shaderc.exe' -ErrorAction SilentlyContinue
            if ($shadercCandidates) { Write-Host "Found downloaded shaderc: $($shadercCandidates[0].FullName)"; exit 0 }
            else { Write-Host "Downloaded archive didn't contain shaderc.exe" }
          } else { Write-Host "No suitable windows asset found in latest release" }
        } catch { Write-Host "Failed to download prebuilt shaderc: $($_.Exception.Message)" }
        Write-Host "Download attempt complete (may have failed). The compile step will proceed and may be a no-op if shaderc is unavailable."





    - name: Setup ProcDump (optional)
      shell: powershell
      continue-on-error: true
      run: |
        Write-Host "Attempting to set up ProcDump for crash capture..."
        if (Test-Path .\scripts\run_procdump_setup.ps1) { powershell -ExecutionPolicy Bypass -File .\scripts\run_procdump_setup.ps1 } else { Write-Host "ProcDump setup script not found" }

    - name: Configure CMake
      shell: powershell
      run: |
        Write-Host "Configuring CMake (Ninja generator)..."
        cmake -S . -B build -G "Ninja" -A x64 -DCMAKE_BUILD_TYPE=Debug -DVCPKG_INSTALLED="${{ github.workspace }}\\vcpkg\\installed\\x64-windows"

    - name: Build SampleGame
      shell: powershell
      run: |
        Write-Host "Building SampleGame (gfx=${{ matrix.gfx }})..."
        cmake --build build --config Debug --target SampleGame

    - name: Run UnitTests and capture log
      shell: powershell
      continue-on-error: true
      run: |
        Write-Host "Running UnitTests..."
        $exe = Join-Path $PWD "build\\tests\\Debug\\UnitTests.exe"
        $log = "unittests-${{ matrix.gfx }}.log"
        if (-Not (Test-Path $exe)) { Write-Host "UnitTests executable not found: $exe; skipping"; exit 0 }
        & $exe --reporter console *>&1 | Tee-Object -FilePath $log
        $exit = $LASTEXITCODE
        Write-Host "UnitTests exit code: $exit"
        if ($exit -ne 0) { Write-Error "UnitTests failed"; exit $exit }

    - name: Run smoke test and capture log
      shell: powershell
      continue-on-error: true
      run: |
        Write-Host "Running SampleGame with gfx=${{ matrix.gfx }} (stress=${{ matrix.stress }}) extraArgs='${{ matrix.extraArgs }}'..."
        $exe = Join-Path $PWD "build\\GameProjects\\SampleGame\\Debug\\SampleGame.exe"
        $log = "smoke-${{ matrix.gfx }}.log"
        if (-Not (Test-Path $exe)) { Write-Error "SampleGame executable not found: $exe"; exit 2 }
        $args = "--gfx-order $(${{ matrix.gfx }}) $(${{ matrix.extraArgs }}) --stress $(${{ matrix.stress }})"
        Write-Host "Full args: $args"
        # If proc dump is available, run under proc dump for vulkan longer stress to capture crashes if present
        $procdump = Join-Path $PWD "tools\\Procdump\\procdump.exe"
        if (Test-Path $procdump -PathType Leaf) {
            Write-Host "Using ProcDump to launch the process: $procdump"
            & $procdump -accepteula -e 1 -ma -o -n 1 $exe $args *>&1 | Tee-Object -FilePath $log
            $exit = $LASTEXITCODE
        } else {
            & $exe $args *>&1 | Tee-Object -FilePath $log
            $exit = $LASTEXITCODE
        }
        Write-Host "Smoke run exit code: $exit"
        if ($exit -ne 0) { Write-Host "Smoke test failed for ${matrix.gfx}"; exit $exit }

    - name: Upload smoke log
      uses: actions/upload-artifact@v4
      with:
        name: smoke-log-${{ matrix.gfx }}
        path: smoke-${{ matrix.gfx }}.log

    - name: Upload any ProcDump .dmp files (if present)
      if: failure() || always()
      uses: actions/upload-artifact@v4
      with:
        name: dmp-files-${{ matrix.gfx }}
        path: |
          **/*.dmp
          tools/Procdump/*.dmp

    - name: Upload entire build folder (diagnostic)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact-${{ matrix.gfx }}
        path: build

  vulkan-stress-loop:
    runs-on: windows-latest
    needs: build-and-smoke
    timeout-minutes: 180
    env:
      ITERATIONS: 50
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Restore vcpkg cache
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/installed
          vcpkg/archives
          vcpkg/vcpkg.exe
        key: ${{ runner.os }}-vcpkg-vulkan-${{ hashFiles('vcpkg/**') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Bootstrap vcpkg (skip if present)
      shell: powershell
      run: |
        if (-Not (Test-Path .\vcpkg\vcpkg.exe)) { .\vcpkg\bootstrap-vcpkg.bat } else { Write-Host "vcpkg.exe present" }

    - name: Configure & build SampleGame
      shell: powershell
      run: |
        Write-Host "Configuring and building SampleGame for Vulkan stress loop..."
        cmake -S . -B build -G "Ninja" -A x64 -DCMAKE_BUILD_TYPE=Debug -DVCPKG_INSTALLED="${{ github.workspace }}\vcpkg\installed\x64-windows"
        cmake --build build --config Debug --target SampleGame

    - name: Setup ProcDump (optional)
      shell: powershell
      continue-on-error: true
      run: |
        if (Test-Path .\scripts\run_procdump_setup.ps1) { powershell -ExecutionPolicy Bypass -File .\scripts\run_procdump_setup.ps1 } else { Write-Host "ProcDump setup not present" }

    - name: Run repeated Vulkan stress iterations
      shell: powershell
      continue-on-error: true
      run: |
        $exe = Join-Path $PWD "build\\GameProjects\\SampleGame\\Debug\\SampleGame.exe"
        if (-Not (Test-Path $exe)) { Write-Error "SampleGame executable not found: $exe"; exit 2 }
        $iterations = [int]$Env:ITERATIONS
        Write-Host "Starting Vulkan stress loop: iterations=$iterations"
        $crashed = $false
        for ($i=1; $i -le $iterations; ++$i) {
            Write-Host "Iteration $i/$iterations"
            $log = "smoke-vulkan-iter-$i.log"
            $procdump = Join-Path $PWD "tools\\Procdump\\procdump.exe"
            if (Test-Path $procdump -PathType Leaf) {
                & $procdump -accepteula -e 1 -ma -o -n 1 $exe --gfx-order vulkan --vulkan-triangle --force-vulkan-swapchain --stress 10 *>&1 | Tee-Object -FilePath $log
            } else {
                & $exe --gfx-order vulkan --vulkan-triangle --force-vulkan-swapchain --stress 10 *>&1 | Tee-Object -FilePath $log
            }
            $exit = $LASTEXITCODE
            if ($exit -ne 0) {
                Write-Host "Iteration $i: non-zero exit ($exit)"
                $crashed = $true
                break
            }
            # check for dmp files
            $dumps = Get-ChildItem -Path . -Filter "*.dmp" -Recurse -ErrorAction SilentlyContinue
            if ($dumps) {
                Write-Host "Iteration $i: found dmp files"
                $crashed = $true
                break
            }
        }
        if ($crashed) { Write-Host "Vulkan stress loop detected a crash"; exit 1 } else { Write-Host "Vulkan stress loop completed without crash" }

    - name: Upload Vulkan iteration logs
      uses: actions/upload-artifact@v4
      with:
        name: vulkan-iteration-logs
        path: smoke-vulkan-iter-*.log

    - name: Upload any ProcDump .dmp files (if present)
      if: failure() || always()
      uses: actions/upload-artifact@v4
      with:
        name: vulkan-dmp-files
        path: |
          **/*.dmp
          tools/Procdump/*.dmp
