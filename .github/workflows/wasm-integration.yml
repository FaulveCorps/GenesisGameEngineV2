name: WASM integration

on:
  pull_request:
    paths:
      - 'Engine/Core/**'
      - 'tests/**'
      - 'GameProjects/**'
      - 'Docs/**'

jobs:
  build:
    name: Build & wasm tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            .\vcpkg\bootstrap-vcpkg.bat
          else
            ./vcpkg/bootstrap-vcpkg.sh
          fi
        shell: bash

      - name: Install dependencies with vcpkg
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            .\vcpkg\vcpkg.exe install sdl3 assimp lua box2d wasm3 --triplet ${{ matrix.triplet }}
          else
            ./vcpkg/vcpkg install sdl3 assimp lua box2d wasm3 --triplet ${{ matrix.triplet }}
          fi
        shell: bash

      - name: Verify wasm3 installation
        run: |
          echo "Listing vcpkg installed dirs for triplet: ${{ matrix.triplet }}"
          ls -la vcpkg/installed/${{ matrix.triplet }}/include || true
          ls -la vcpkg/installed/${{ matrix.triplet }}/lib || true
          ls -la vcpkg/installed/${{ matrix.triplet }}/bin || true
        shell: bash

      - name: Configure CMake (Debug)
        run: |
          cmake -S . -B Build -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Debug)
        run: cmake --build Build --config Debug -- -j $(nproc || sysctl -n hw.ncpu || 2)

      - name: Run wasm tests
        run: |
          cd Build
          ctest -R wasm -V -C Debug
        shell: bash
