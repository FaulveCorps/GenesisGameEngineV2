name: Feature Branch Windows CI

on:
  push:
    branches: [ feature/software-renderer ]

jobs:
  windows-ci:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg (robust)
        shell: powershell
        run: |
          Write-Host "Bootstrapping or updating vcpkg..."
          if (-Not (Test-Path .\vcpkg\vcpkg.exe)) {
            if (Test-Path .\vcpkg) {
              Write-Host "Found vcpkg folder but missing vcpkg.exe. Attempting to update or re-clone..."
              if (Test-Path .\vcpkg\.git) {
                git -C .\vcpkg pull
              } else {
                Write-Host "Removing non-git vcpkg folder and re-cloning"
                Remove-Item -Recurse -Force .\vcpkg
                git clone https://github.com/microsoft/vcpkg.git vcpkg
              }
              .\vcpkg\bootstrap-vcpkg.bat
            } else {
              git clone https://github.com/microsoft/vcpkg.git vcpkg
              .\vcpkg\bootstrap-vcpkg.bat
            }
          } else {
            Write-Host "vcpkg.exe present - skipping bootstrap"
          }

      - name: Install vcpkg dependencies
        shell: powershell
        run: |
          Write-Host "Installing sdl2 and assimp via vcpkg"
          .\vcpkg\vcpkg.exe install sdl2:x64-windows assimp:x64-windows --disable-metrics

      - name: Configure CMake (generator selection + vcpkg toolchain)
        shell: powershell
        run: |
          Write-Host "Environment diagnostics: cmake, ninja, cl, vswhere"
          cmake --version
          if (Get-Command ninja -ErrorAction SilentlyContinue) { ninja --version } else { Write-Host "ninja: NOT FOUND" }
          if (Get-Command cl -ErrorAction SilentlyContinue) { Write-Host "cl.exe found at:"; where cl } else { Write-Host "cl.exe: NOT FOUND" }
          if (Test-Path "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe") { & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath } else { Write-Host "vswhere: NOT FOUND" }

          $toolchain = "${{ github.workspace }}\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"

          if (Get-Command cl -ErrorAction SilentlyContinue) {
            Write-Host "Configuring with Visual Studio generator (Visual Studio 17 2022, x64)..."
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET="x64-windows" 2>&1 | Tee-Object -FilePath cmake_configure.log -Encoding UTF8
          } elseif (Get-Command ninja -ErrorAction SilentlyContinue) {
            Write-Host "Configuring with Ninja Multi-Config generator..."
            $ninjaPath = (Get-Command ninja).Source
            cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_MAKE_PROGRAM="$ninjaPath" -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET="x64-windows" 2>&1 | Tee-Object -FilePath cmake_configure.log -Encoding UTF8
          } else {
            Write-Host "No cl nor ninja found; attempting to install Ninja via winget..."
            winget install --id Ninja-build.Ninja -e --accept-package-agreements --accept-source-agreements
            $ninjaPath = (Get-Command ninja).Source
            cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_MAKE_PROGRAM="$ninjaPath" -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET="x64-windows" 2>&1 | Tee-Object -FilePath cmake_configure.log -Encoding UTF8
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configure failed. See cmake_configure.log for details."
            Write-Host "---- Begin cmake_configure.log ----"
            if (Test-Path cmake_configure.log) { Get-Content cmake_configure.log -Raw | Write-Host }
            Write-Host "---- End cmake_configure.log ----"
            Exit $LASTEXITCODE
          }

      - name: Dump CMake configure log
        if: always()
        shell: powershell
        run: |
          Write-Host "==== cmake_configure.log contents ===="
          if (Test-Path cmake_configure.log) {
            Get-Content cmake_configure.log -Encoding UTF8 | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "cmake_configure.log not found"
          }

      - name: List files for artifacts
        if: always()
        shell: powershell
        run: |
          Write-Host "==== Listing workspace files (for artifact upload) ===="
          Get-ChildItem -Recurse -File | ForEach-Object { Write-Host "$($_.FullName) - $($_.Length) bytes" }

      - name: Build SampleGame
        shell: powershell
        run: |
          Write-Host "Building SampleGame"
          cmake --build build --config Debug --target SampleGame

      - name: Run UnitTests and capture log
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Running UnitTests..."
          $exe = Join-Path $PWD "build\tests\Debug\UnitTests.exe"
          $log = "unittests.log"
          if (-Not (Test-Path $exe)) { Write-Host "UnitTests executable not found: $exe"; Exit 0 }
          & $exe --reporter console *>&1 | Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          Write-Host "UnitTests exit code: $exit"
          if ($exit -ne 0) { Write-Host "UnitTests failed (non-zero exit)" }

      - name: Run OpenGL smoke run and capture log
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Running SampleGame (opengl) smoke run..."
          $exe = Join-Path $PWD "build\GameProjects\SampleGame\Debug\SampleGame.exe"
          $log = "smoke-opengl.log"
          if (-Not (Test-Path $exe)) { Write-Host "SampleGame executable not found: $exe"; Exit 0 }
          & $exe --gfx-order opengl --2d-demo --stress 1 *>&1 | Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          Write-Host "Smoke run exit code: $exit"
          if ($exit -ne 0) { Write-Host "Smoke run failed (non-zero exit)" }

      - name: Upload logs and build folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-logs
          path: |
            unittests.log
            smoke-opengl.log
            cmake_configure.log
            build
