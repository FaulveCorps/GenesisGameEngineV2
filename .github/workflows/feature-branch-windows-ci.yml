name: Feature Branch Windows CI

on:
  push:
    branches: [ feature/software-renderer ]

jobs:
  windows-ci:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg (robust)
        shell: powershell
        run: |
          Write-Host "Bootstrapping or updating vcpkg..."
          if (-Not (Test-Path .\vcpkg\vcpkg.exe)) {
            if (Test-Path .\vcpkg) {
              Write-Host "Found vcpkg folder but missing vcpkg.exe. Attempting to update or re-clone..."
              if (Test-Path .\vcpkg\.git) {
                git -C .\vcpkg pull
              } else {
                Write-Host "Removing non-git vcpkg folder and re-cloning"
                Remove-Item -Recurse -Force .\vcpkg
                git clone https://github.com/microsoft/vcpkg.git vcpkg
              }
              .\vcpkg\bootstrap-vcpkg.bat
            } else {
              git clone https://github.com/microsoft/vcpkg.git vcpkg
              .\vcpkg\bootstrap-vcpkg.bat
            }
          } else {
            Write-Host "vcpkg.exe present - skipping bootstrap"
          }

      - name: Install vcpkg dependencies
        shell: powershell
        run: |
          Write-Host "Installing sdl2 and assimp via vcpkg"
          .\vcpkg\vcpkg.exe install sdl2:x64-windows assimp:x64-windows --disable-metrics

      - name: Configure CMake (Ninja + vcpkg toolchain)
        shell: powershell
        run: |
          Write-Host "Configuring CMake (Ninja) using vcpkg toolchain..."
          $toolchain = "${{ github.workspace }}\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"
          cmake -S . -B build -G "Ninja" -A x64 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET="x64-windows" 2>&1 | Tee-Object -FilePath cmake_configure.log -Encoding UTF8
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CMake configure failed. See cmake_configure.log for details."
            Exit $LASTEXITCODE
          }

      - name: Build SampleGame
        shell: powershell
        run: |
          Write-Host "Building SampleGame"
          cmake --build build --config Debug --target SampleGame

      - name: Run UnitTests and capture log
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Running UnitTests..."
          $exe = Join-Path $PWD "build\tests\Debug\UnitTests.exe"
          $log = "unittests.log"
          if (-Not (Test-Path $exe)) { Write-Host "UnitTests executable not found: $exe"; Exit 0 }
          & $exe --reporter console *>&1 | Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          Write-Host "UnitTests exit code: $exit"
          if ($exit -ne 0) { Write-Host "UnitTests failed (non-zero exit)" }

      - name: Run OpenGL smoke run and capture log
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Running SampleGame (opengl) smoke run..."
          $exe = Join-Path $PWD "build\GameProjects\SampleGame\Debug\SampleGame.exe"
          $log = "smoke-opengl.log"
          if (-Not (Test-Path $exe)) { Write-Host "SampleGame executable not found: $exe"; Exit 0 }
          & $exe --gfx-order opengl --2d-demo --stress 1 *>&1 | Tee-Object -FilePath $log
          $exit = $LASTEXITCODE
          Write-Host "Smoke run exit code: $exit"
          if ($exit -ne 0) { Write-Host "Smoke run failed (non-zero exit)" }

      - name: Upload logs and build folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-branch-logs
          path: |
            unittests.log
            smoke-opengl.log
            cmake_configure.log
            build
